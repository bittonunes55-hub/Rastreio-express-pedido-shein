
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreio</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html, body{
            width:100%;
            height:100%;
            background:#ffffff;
            overflow:hidden;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
        }

        img{
            width:100vw;
            height:100vh;
            object-fit:contain;
            display:block;
            user-select:none;
            -webkit-user-drag:none;
        }
    </style>
</head>

<body>

    <img src="rastreio.png" alt="Rastreio">

</body>
</html>
